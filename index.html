<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手自笔录 (shǒuzìbǐlù)</title>
<style>
  @import url("https://fontsapi.zeoseven.com/442/main/result.css");
  body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  .bar { margin: 12px 0; color: #666; font-size: 14px; line-height: 2; }
  select, button { font-size: 14px; }
  #editor {
    border: 1px solid #ccc; border-radius: 6px; padding: 12px;
    width: 100%; box-sizing: border-box;
    min-height: 240px; font-size: 18px; line-height: 1.8; outline: none;
    resize: vertical; tab-size: 4;
    /* 等宽字体链：Maple Mono NF CN（web font，1:2），离线退化到 ime-mono 合成 */
    font-family: "Maple Mono NF CN", "ime-mono", Menlo, monospace;
  }
  #editor:focus { border-color: #4a90d9; }
  #mode { display: inline-block; min-width: 4em; padding: 0 6px; border-radius: 3px;
          background: #4a90d9; color: #fff; font-size: 12px; text-align: center; }
  #mode.normal { background: #2d8a4e; }
  #mode.search { background: #b07500; }
  #mode.en { background: #888; }
  #status { color: #999; font-size: 13px; margin-top: 16px; white-space: pre-wrap; }
  details { margin-top: 12px; font-size: 14px; color: #666; }
  #mappings {
    width: 100%; box-sizing: border-box; min-height: 180px;
    font: 13px/1.5 ui-monospace, Menlo, monospace; margin-top: 8px;
  }
</style>
</head>
<body>
<h1>手自笔录 (shǒuzìbǐlù)</h1>
<div class="bar">
  键盘:
  <select id="keyMode">
    <option value="physical" selected>物理键 (e.code)</option>
    <option value="letter">字母 (e.key)</option>
  </select>
  布局:
  <select id="layout">
    <option value="qwerty">QWERTY</option>
    <option value="dvorak">Dvorak</option>
    <option value="dvorak4tzx" selected>Dvorak4TZX</option>
  </select>
  方案:
  <select id="scheme">
    <option value="ziranma">双拼 · 自然码</option>
    <option value="full">全拼</option>
  </select>
  <label><input type="checkbox" id="vim" checked> vim</label>
  <br />
  <span id="mode">…</span>
  <label><input type="checkbox" id="fuzzy" checked> 模糊音</label>
  符号:
  <select id="punct">
    <option value="zh">中文符号</option>
    <option value="en">英文符号</option>
    <option value="tw">繁体符号</option>
  </select>
  翻页:
  <select id="paging">
    <option value=",." selected>, .</option>
    <option value="-=">- =</option>
    <option value="[]">[ ]</option>
    <option value="pg">仅 PgUp/PgDn</option>
  </select>
  <button id="exportBtn">导出</button>
  <button id="importBtn">导入</button>
  <button id="clearBtn">清空学习</button>
  <input type="file" id="importFile" accept=".json" style="display:none">
</div>
<textarea id="editor" autocomplete="off" autocorrect="off" autocapitalize="off"
          spellcheck="false" wrap="soft"></textarea>
<details>
  <summary>动态词映射（<code>,</code> 开头触发，<code>eval:</code> 执行 JS）</summary>
  <textarea id="mappings" spellcheck="false"></textarea>
  <div>
    <button id="mappingsSave">保存</button>
    <button id="mappingsReset">恢复默认</button>
    <span id="mappingsMsg" style="color:#999;font-size:13px"></span>
  </div>
</details>
<div id="status">加载中…</div>

<script src="wasm/naive_pinyin.js"></script>
<script src="ime-editor.js"></script>
<script>
"use strict";
const editor = document.getElementById("editor");
const status = document.getElementById("status");
const modeBadge = document.getElementById("mode");
const schemeSel = document.getElementById("scheme");
const layoutSel = document.getElementById("layout");
const keyModeSel = document.getElementById("keyMode");
const vimBox = document.getElementById("vim");
const punctSel = document.getElementById("punct");
const fuzzyBox = document.getElementById("fuzzy");
const pagingSel = document.getElementById("paging");
const mappingsTa = document.getElementById("mappings");
const mappingsMsg = document.getElementById("mappingsMsg");

const LS_FREQ = "naive_pinyin.user_freq";
const LS_SETTINGS = "shouzibilu.settings";
const LS_MAPPINGS = "shouzibilu.mappings";
const LS_CONTENT = "shouzibilu.content";
const LS_MAPPINGS_DRAFT = "shouzibilu.mappings_draft";

let Module, dictData, ziranma;
let engineCtx = null;
let ime = null;
let loadMs = "?";

// ---------- 设置持久化 ----------
function loadSettings() {
  try { return JSON.parse(localStorage.getItem(LS_SETTINGS) || "{}"); }
  catch (e) { return {}; }
}
function saveSettings() {
  localStorage.setItem(LS_SETTINGS, JSON.stringify({
    scheme: schemeSel.value, layout: layoutSel.value, keyMode: keyModeSel.value,
    vim: vimBox.checked, punct: punctSel.value, fuzzy: fuzzyBox.checked,
    paging: pagingSel.value,
  }));
}
function loadMappings() {
  try {
    const m = JSON.parse(localStorage.getItem(LS_MAPPINGS) || "null");
    if (m && typeof m === "object" && !Array.isArray(m)) return m;
  } catch (e) { /* fall through */ }
  return ImeEditor.DEFAULT_MAPPINGS;
}

// ---------- 等宽字体合成（Maple Mono web font 加载失败时的离线先底） ----------
// 用 @font-face 拼一个：Menlo 只接 ASCII，size-adjust 把 advance 压到 0.5em；
// PingFang SC 汉字天然全宽 1em。运行时实测 Menlo advance，跨机器稳健。
// 注意：src:local() 必须用 PostScript 名（带空格的家族名会 error）。
function setupMonoFont() {
  const cv = document.createElement("canvas").getContext("2d");
  cv.font = "100px Menlo";
  const adv = cv.measureText("0").width / 100;   // 单位 em
  if (!(adv > 0.3 && adv < 1)) return;           // Menlo 不存在就放弃
  const adjust = (0.5 / adv * 100).toFixed(2);
  const st = document.createElement("style");
  // 注意：src:local() 必须用 PostScript 名（带空格的家族名会 error）
  st.textContent =
    `@font-face{font-family:'ime-mono';src:local('Menlo-Regular');` +
    `unicode-range:U+0020-007E;size-adjust:${adjust}%}` +
    `@font-face{font-family:'ime-mono';src:local('PingFangSC-Regular');` +
    `unicode-range:U+2E80-9FFF,U+3000-303F,U+FF00-FFEF,` +
    `U+2018,U+2019,U+201C,U+201D,U+2026,U+2014;}`;
  document.head.appendChild(st);
}

// ---------- 内容持久化（10s 定时 + 页面隐藏时冲刷） ----------
function persistAll() {
  localStorage.setItem(LS_CONTENT, editor.value);
  localStorage.setItem(LS_MAPPINGS_DRAFT, mappingsTa.value);
}

// ---------- 引擎 ----------
async function boot() {
  setupMonoFont();
  Module = await createNaivePinyin();
  [dictData, ziranma] = await Promise.all([
    fetch("data/naive_pinyin.dict.txt").then(r => r.arrayBuffer()),
    fetch("wasm/ziranma.json").then(r => r.json()),
  ]);

  // 恢复设置
  const s = loadSettings();
  if (s.scheme) schemeSel.value = s.scheme;
  if (s.layout) layoutSel.value = s.layout;
  if (s.keyMode) keyModeSel.value = s.keyMode;
  if (s.vim != null) vimBox.checked = s.vim;
  if (s.punct) punctSel.value = s.punct;
  if (s.fuzzy != null) fuzzyBox.checked = s.fuzzy;
  if (s.paging) pagingSel.value = s.paging;

  rebuildEngine();
  // 恢复上次内容与映射草稿
  editor.value = localStorage.getItem(LS_CONTENT) || "";
  const draft = localStorage.getItem(LS_MAPPINGS_DRAFT);
  mappingsTa.value = draft != null ? draft : JSON.stringify(loadMappings(), null, 2);
  attachEditor();
  setInterval(persistAll, 10000);
  window.addEventListener("pagehide", persistAll);
  editor.focus();
}

function rebuildEngine() {
  if (engineCtx) Module.ccall("np_destroy", null, ["number"], [engineCtx]);
  const config = { max_candidates: 50 };
  if (schemeSel.value === "ziranma") config.shuangpin = ziranma.shuangpin;
  if (fuzzyBox.checked) config.fuzzy = [["z","zh"],["c","ch"],["s","sh"],["in","ing"],["en","eng"]];
  try {
    config.user_freq = JSON.parse(localStorage.getItem(LS_FREQ) || "[]");
  } catch (e) { config.user_freq = []; }
  engineCtx = Module.ccall("np_create", "number", ["string"], [JSON.stringify(config)]);
  const ptr = Module._malloc(dictData.byteLength);
  Module.HEAPU8.set(new Uint8Array(dictData), ptr);
  const t0 = performance.now();
  Module.ccall("np_load_dict", "number", ["number","number","number"], [engineCtx, ptr, dictData.byteLength]);
  loadMs = (performance.now() - t0).toFixed(0);
  Module._free(ptr);
  updateStatus();
}

// 引擎适配器：ime-editor 通过它访问 wasm（闭包内取最新 ctx，重建无感）
const engineAdapter = {
  query(input) {
    return JSON.parse(Module.ccall("np_query", "string", ["number","string"], [engineCtx, input]));
  },
  segment(input) {
    return JSON.parse(Module.ccall("np_segment", "string", ["number","string"], [engineCtx, input]));
  },
  commit(segments) {
    Module.ccall("np_commit", null, ["number","string"], [engineCtx, JSON.stringify(segments)]);
    scheduleSave();
  },
  learnWord(key, word) {
    Module.ccall("np_learn_word", null, ["number","string","string"], [engineCtx, key, word]);
    scheduleSave();
  },
  dumpUser() {
    return Module.ccall("np_dump_user", "string", ["number"], [engineCtx]);
  },
};

let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem(LS_FREQ, engineAdapter.dumpUser());
    updateStatus();
  }, 500);
}

function updateStatus() {
  const learned = JSON.parse(localStorage.getItem(LS_FREQ) || "[]").length;
  status.textContent =
    `词典 ${(dictData.byteLength/1048576).toFixed(1)} MB · 解析 ${loadMs} ms · 学习数据 ${learned} 条\n` +
    "i 进入插入 · Esc/Ctrl+[ 回普通 · / 搜索 · , 动态词 · ←→ 组词光标 · Shift 切换中英文\n" +
    "注意：请把 OS 输入法切到英文状态使用（网页无法压制激活的系统输入法）。";
}

function onMode(mode, english) {
  modeBadge.className = "";
  if (mode === "NORMAL") { modeBadge.textContent = "NORMAL"; modeBadge.className = "normal"; }
  else if (mode === "SEARCH") { modeBadge.textContent = "SEARCH"; modeBadge.className = "search"; }
  else if (english) { modeBadge.textContent = "EN"; modeBadge.className = "en"; }
  else modeBadge.textContent = "中";
}

function attachEditor() {
  ime = ImeEditor.attach(editor, {
    getEngine: () => engineAdapter,
    layout: layoutSel.value,
    keyMode: keyModeSel.value,
    vim: vimBox.checked,
    punctStyle: punctSel.value,
    pagingKeys: pagingSel.value === "pg" ? null : pagingSel.value,
    mappings: loadMappings(),
    indent: "    ",
    onMode,
  });
}

// ---------- 控件 ----------
schemeSel.onchange = () => { rebuildEngine(); saveSettings(); editor.focus(); };
fuzzyBox.onchange = () => { rebuildEngine(); saveSettings(); editor.focus(); };
layoutSel.onchange = () => { ime.setOption({layout: layoutSel.value}); saveSettings(); editor.focus(); };
keyModeSel.onchange = () => { ime.setOption({keyMode: keyModeSel.value}); saveSettings(); editor.focus(); };
vimBox.onchange = () => { ime.setOption({vim: vimBox.checked}); saveSettings(); editor.focus(); };
punctSel.onchange = () => { ime.setOption({punctStyle: punctSel.value}); saveSettings(); editor.focus(); };
pagingSel.onchange = () => {
  ime.setOption({pagingKeys: pagingSel.value === "pg" ? null : pagingSel.value});
  saveSettings(); editor.focus();
};

// ---------- 动态词映射编辑 ----------
document.getElementById("mappingsSave").onclick = () => {
  let m;
  try {
    m = JSON.parse(mappingsTa.value);
    if (!m || typeof m !== "object" || Array.isArray(m)) throw new Error("应为 JSON 对象");
  } catch (e) {
    mappingsMsg.textContent = "JSON 错误: " + e.message;
    return;
  }
  // eval 条目确认（导入他人配置 = 执行他人代码）
  const evals = Object.entries(m).filter(([, v]) =>
    typeof v === "string" && v.startsWith("eval:"));
  for (const [k] of evals) {
    if (typeof m[k] !== "string") { mappingsMsg.textContent = k + " 的值应为字符串"; return; }
  }
  if (evals.length) {
    const list = evals.map(([k, v]) => k + "  →  " + v).join("\n");
    if (!confirm(`以下 ${evals.length} 条映射包含 eval: 代码，保存即信任其执行：\n\n${list}`)) {
      mappingsMsg.textContent = "已取消。";
      return;
    }
  }
  localStorage.setItem(LS_MAPPINGS, JSON.stringify(m));
  ime.setOption({mappings: m});
  mappingsMsg.textContent = `已保存 ${Object.keys(m).length} 条。`;
};
document.getElementById("mappingsReset").onclick = () => {
  mappingsTa.value = JSON.stringify(ImeEditor.DEFAULT_MAPPINGS, null, 2);
  mappingsMsg.textContent = "已载入默认表（未保存）。";
};

// ---------- 学习数据 导出/导入/清空 ----------
document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([engineAdapter.dumpUser()], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "naive_pinyin_user_freq.json";
  a.click();
  URL.revokeObjectURL(a.href);
};

const importFile = document.getElementById("importFile");
document.getElementById("importBtn").onclick = () => importFile.click();
importFile.onchange = async () => {
  const file = importFile.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data)) throw new Error("格式应为 JSON 数组");
    localStorage.setItem(LS_FREQ, JSON.stringify(data));
    rebuildEngine();
    status.textContent = `已导入 ${data.length} 条学习数据。`;
  } catch (e) {
    status.textContent = "导入失败: " + e.message;
  }
  importFile.value = "";
};

document.getElementById("clearBtn").onclick = () => {
  if (!confirm("清空全部调频与自造词学习数据？")) return;
  localStorage.removeItem(LS_FREQ);
  rebuildEngine();
  status.textContent = "学习数据已清空。";
};

boot().catch(e => { status.textContent = "加载失败: " + e; });
</script>
</body>
</html>
